<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#c7ddf5"/><stop offset="100%" stop-color="#b8d4f0"/></linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="960" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#4b5563" letter-spacing="1">BOOK INDEX - ONE BUILDING, THREE CHAPTERS - /book</text>
  <text x="40" y="52" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">DESKTOP (16:9)</text>
  <text x="1500" y="52" fill="#d946ef" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">MOBILE</text>

  <g id="desktop" transform="translate(40, 60)">
    <rect width="1280" height="720" rx="8" fill="#e8d4b8" stroke="#b8a080"/>
    <use href="includes/header-desktop.svg#desktop-header" x="0" y="0"/>

    <!-- Page heading, top-left of the building -->
    <text x="40" y="100" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#1f2937">Hat, Coat &amp; Boots</text>
    <text x="40" y="128" font-family="system-ui, sans-serif" font-size="16" fill="#4b5563">One building wears all three. Pick a part.</text>

    <!-- Language switcher, top-right (three 44px pills) -->
    <g id="lang-switcher" transform="translate(1010, 90)">
      <a href="#lang-en"><rect x="0" y="0" width="44" height="44" rx="8" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/><text x="22" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f5f0e6">EN</text></a>
      <a href="#lang-es"><rect x="52" y="0" width="44" height="44" rx="8" fill="#f5f0e6" stroke="#b8a080" stroke-width="2"/><text x="74" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#4b5563">ES</text></a>
      <a href="#lang-zh"><rect x="104" y="0" width="44" height="44" rx="8" fill="#f5f0e6" stroke="#b8a080" stroke-width="2"/><text x="126" y="29" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#4b5563">中文</text></a>
    </g>

    <!-- ===== CANONICAL BUILDING (identical in every wireframe; translate fixed at 360,150) ===== -->
    <g id="building" transform="translate(360, 150)">
      <!-- layer: sun-high (summer, steep) -->
      <g id="layer-sun-high">
        <line x1="40" y1="-2" x2="150" y2="150" stroke="#e8821e" stroke-width="3" stroke-dasharray="4 5"/>
        <line x1="70" y1="-2" x2="180" y2="150" stroke="#e8821e" stroke-width="3" stroke-dasharray="4 5"/>
        <text x="10" y="20" font-family="system-ui, sans-serif" font-size="14" fill="#c25a14">summer sun (high) - blocked at eave</text>
      </g>
      <!-- layer: sun-low (winter, shallow) -->
      <g id="layer-sun-low">
        <line x1="-40" y1="150" x2="250" y2="250" stroke="#e8821e" stroke-width="3"/>
        <text x="-40" y="142" font-family="system-ui, sans-serif" font-size="14" fill="#c25a14">winter sun (low) - reaches window</text>
      </g>
      <!-- layer: rain -->
      <g id="layer-rain">
        <line x1="20" y1="166" x2="0" y2="330" stroke="#0e6e8c" stroke-width="2" stroke-dasharray="2 7"/>
        <line x1="34" y1="166" x2="14" y2="330" stroke="#0e6e8c" stroke-width="2" stroke-dasharray="2 7"/>
        <text x="-40" y="352" font-family="system-ui, sans-serif" font-size="14" fill="#0e6e8c">rain sheds clear of the wall base</text>
      </g>
      <!-- layer: foundation / BOOTS (footing) -->
      <g id="layer-boots">
        <rect x="40" y="300" width="280" height="34" fill="#3a6ea5" stroke="#26527a" stroke-width="2"/>
        <line x1="-20" y1="334" x2="380" y2="334" stroke="#3a6ea5" stroke-width="2"/>
        <text x="180" y="324" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f5f0e6">BOOTS</text>
      </g>
      <!-- layer: envelope / COAT (walls + window) -->
      <g id="layer-coat">
        <rect x="80" y="120" width="200" height="180" fill="#f3e2c7" stroke="#3a6ea5" stroke-width="3"/>
        <rect x="120" y="170" width="120" height="90" fill="#bfe3ec" stroke="#3a6ea5" stroke-width="2"/>
        <text x="180" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#1f2937">COAT</text>
      </g>
      <!-- layer: roof / HAT (roof + projecting overhang) -->
      <g id="layer-hat">
        <polygon points="60,120 180,40 300,120" fill="#b07a4a" stroke="#3a6ea5" stroke-width="3"/>
        <rect x="30" y="120" width="300" height="16" rx="2" fill="#b07a4a" stroke="#3a6ea5" stroke-width="2"/>
        <text x="180" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f5f0e6">HAT</text>
      </g>
    </g>

    <!-- Three chapter CTA rows, right of the building (x>=820) -->
    <g id="chapter-rows" transform="translate(820, 180)">
      <!-- leader lines from building layers to rows -->
      <line x1="-110" y1="40" x2="0" y2="40" stroke="#b8a080" stroke-width="1" stroke-dasharray="3 4"/>
      <line x1="-110" y1="130" x2="0" y2="130" stroke="#b8a080" stroke-width="1" stroke-dasharray="3 4"/>
      <line x1="-110" y1="220" x2="0" y2="220" stroke="#b8a080" stroke-width="1" stroke-dasharray="3 4"/>

      <!-- Hat row: AVAILABLE -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="380" height="74" rx="8" fill="#f5f0e6" stroke="#b8a080" stroke-width="2"/>
        <text x="18" y="34" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1f2937">Hat - the roof</text>
        <rect x="18" y="44" width="96" height="22" rx="11" fill="#16a34a"/>
        <text x="66" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5f0e6">AVAILABLE</text>
        <a href="#read-hat"><rect x="276" y="16" width="88" height="44" rx="8" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/><text x="320" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f5f0e6">Read</text></a>
      </g>

      <!-- Coat row: Coming soon -->
      <g transform="translate(0, 90)">
        <rect x="0" y="0" width="380" height="74" rx="8" fill="#f5f0e6" stroke="#b8a080" stroke-width="2"/>
        <text x="18" y="34" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#6b7280">Coat - the walls</text>
        <rect x="18" y="44" width="124" height="22" rx="11" fill="#dcc8a8" stroke="#b8a080" stroke-width="1"/>
        <text x="80" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c6f57">Coming soon</text>
      </g>

      <!-- Boots row: Coming soon -->
      <g transform="translate(0, 180)">
        <rect x="0" y="0" width="380" height="74" rx="8" fill="#f5f0e6" stroke="#b8a080" stroke-width="2"/>
        <text x="18" y="34" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#6b7280">Boots - the foundation</text>
        <rect x="18" y="44" width="124" height="22" rx="11" fill="#dcc8a8" stroke="#b8a080" stroke-width="1"/>
        <text x="80" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c6f57">Coming soon</text>
      </g>
    </g>

    <!-- Red callouts on HAT, COAT, BOOTS zones + language switcher -->
    <!-- HAT zone: building(360,150)+layer-hat text ~ (360+180,150+96)=(540,246) -->
    <circle cx="540" cy="226" r="14" fill="#dc2626"/>
    <text x="540" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f5f0e6">2</text>
    <!-- COAT zone: (360+180,150+210)=(540,360) -->
    <circle cx="540" cy="360" r="14" fill="#dc2626"/>
    <text x="540" y="366" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f5f0e6">1</text>
    <!-- BOOTS zone: (360+180,150+317)=(540,467) -->
    <circle cx="540" cy="467" r="14" fill="#dc2626"/>
    <text x="540" y="473" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f5f0e6">3</text>
    <!-- Language switcher zone: (1010+126, 90+44)=(1136,134) below 中文 pill -->
    <circle cx="1136" cy="158" r="14" fill="#dc2626"/>
    <text x="1136" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f5f0e6">4</text>

    <use href="includes/footer-desktop.svg#site-footer" x="0" y="640"/>
  </g>

  <g id="mobile" transform="translate(1360, 60)">
    <rect width="360" height="720" rx="24" fill="#e8d4b8" stroke="#b8a080"/>
    <use href="includes/header-mobile.svg#mobile-header-group" x="0" y="0"/>

    <!-- Heading -->
    <text x="20" y="112" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1f2937">Hat, Coat &amp; Boots</text>
    <text x="20" y="134" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">One building wears all three.</text>

    <!-- Language switcher (three 44px pills) -->
    <g transform="translate(20, 146)">
      <a href="#m-lang-en"><rect x="0" y="0" width="44" height="44" rx="8" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/><text x="22" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5f0e6">EN</text></a>
      <a href="#m-lang-es"><rect x="52" y="0" width="44" height="44" rx="8" fill="#f5f0e6" stroke="#b8a080" stroke-width="2"/><text x="74" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#4b5563">ES</text></a>
      <a href="#m-lang-zh"><rect x="104" y="0" width="44" height="44" rx="8" fill="#f5f0e6" stroke="#b8a080" stroke-width="2"/><text x="126" y="29" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#4b5563">中文</text></a>
    </g>

    <!-- Simplified stacked building echo (HAT / COAT / BOOTS) -->
    <g id="mobile-building" transform="translate(130, 210)">
      <polygon points="-20,40 50,0 120,40" fill="#b07a4a" stroke="#3a6ea5" stroke-width="2"/>
      <rect x="-26" y="40" width="152" height="10" rx="2" fill="#b07a4a" stroke="#3a6ea5" stroke-width="2"/>
      <text x="50" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5f0e6">HAT</text>
      <rect x="10" y="50" width="80" height="80" fill="#f3e2c7" stroke="#3a6ea5" stroke-width="2"/>
      <rect x="30" y="74" width="40" height="34" fill="#bfe3ec" stroke="#3a6ea5" stroke-width="2"/>
      <text x="50" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">COAT</text>
      <rect x="0" y="130" width="100" height="16" fill="#3a6ea5" stroke="#26527a" stroke-width="2"/>
      <text x="50" y="143" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5f0e6">BOOTS</text>
    </g>

    <!-- Chapter rows -->
    <g transform="translate(20, 400)">
      <rect x="0" y="0" width="320" height="56" rx="8" fill="#f5f0e6" stroke="#b8a080" stroke-width="2"/>
      <text x="14" y="26" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2937">Hat - the roof</text>
      <rect x="14" y="32" width="90" height="18" rx="9" fill="#16a34a"/>
      <text x="59" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5f0e6">AVAILABLE</text>
      <a href="#m-read-hat"><rect x="232" y="6" width="80" height="44" rx="8" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/><text x="272" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5f0e6">Read</text></a>
    </g>
    <g transform="translate(20, 466)">
      <rect x="0" y="0" width="320" height="48" rx="8" fill="#f5f0e6" stroke="#b8a080" stroke-width="2"/>
      <text x="14" y="22" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#6b7280">Coat - the walls</text>
      <rect x="200" y="14" width="106" height="20" rx="10" fill="#dcc8a8" stroke="#b8a080" stroke-width="1"/>
      <text x="253" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c6f57">Coming soon</text>
    </g>
    <g transform="translate(20, 524)">
      <rect x="0" y="0" width="320" height="48" rx="8" fill="#f5f0e6" stroke="#b8a080" stroke-width="2"/>
      <text x="14" y="22" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#6b7280">Boots - the foundation</text>
      <rect x="200" y="14" width="106" height="20" rx="10" fill="#dcc8a8" stroke="#b8a080" stroke-width="1"/>
      <text x="253" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c6f57">Coming soon</text>
    </g>

    <!-- Mobile callouts (r=11) on HAT and language switcher -->
    <circle cx="180" cy="227" r="11" fill="#dc2626"/>
    <text x="180" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5f0e6">2</text>
    <circle cx="160" cy="168" r="11" fill="#dc2626"/>
    <text x="160" y="173" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5f0e6">4</text>

    <use href="includes/footer-mobile.svg#mobile-bottom-nav" x="0" y="664"/>
  </g>

  <g id="annotations" transform="translate(40, 800)">
    <rect width="1840" height="220" rx="8" fill="#dcc8a8" stroke="#b8a080"/>

    <g transform="translate(20, 16)">
      <circle cx="12" cy="12" r="12" fill="#dc2626"/>
      <text x="12" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5f0e6">1</text>
      <text x="38" y="18" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2937">One building, drawn once</text>
      <a href="#us-001" transform="translate(38, 28)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-001</text></a>
      <a href="#fr-001a" transform="translate(102, 28)"><rect width="64" height="22" rx="11" fill="#2563eb"/><text x="32" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">FR-001a</text></a>
      <text x="38" y="76" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">The canonical building renders once at a fixed</text>
      <text x="38" y="94" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">transform so all chapters register as layers.</text>
    </g>

    <g transform="translate(520, 16)">
      <circle cx="12" cy="12" r="12" fill="#dc2626"/>
      <text x="12" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5f0e6">2</text>
      <text x="38" y="18" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2937">Hat = roof, available</text>
      <a href="#us-001" transform="translate(38, 28)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-001</text></a>
      <a href="#fr-007" transform="translate(102, 28)"><rect width="56" height="22" rx="11" fill="#2563eb"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">FR-007</text></a>
      <text x="38" y="76" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">The Hat chapter ships first: green AVAILABLE</text>
      <text x="38" y="94" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">pill and a purple Read call-to-action.</text>
    </g>

    <g transform="translate(1020, 16)">
      <circle cx="12" cy="12" r="12" fill="#dc2626"/>
      <text x="12" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5f0e6">3</text>
      <text x="38" y="18" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2937">Coat &amp; Boots coming soon</text>
      <a href="#us-001" transform="translate(38, 28)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-001</text></a>
      <a href="#fr-007b" transform="translate(102, 28)"><rect width="64" height="22" rx="11" fill="#2563eb"/><text x="32" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">FR-007b</text></a>
      <text x="38" y="76" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">Future chapters are visible but disabled with</text>
      <text x="38" y="94" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">tan Coming soon pills, not hidden away.</text>
    </g>

    <g transform="translate(20, 116)">
      <circle cx="12" cy="12" r="12" fill="#dc2626"/>
      <text x="12" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5f0e6">4</text>
      <text x="38" y="18" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2937">Language + a11y</text>
      <a href="#us-003" transform="translate(38, 28)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-003</text></a>
      <a href="#us-004" transform="translate(102, 28)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-004</text></a>
      <a href="#fr-016" transform="translate(166, 28)"><rect width="56" height="22" rx="11" fill="#2563eb"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">FR-016</text></a>
      <text x="38" y="76" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">EN / ES / 中文 switch with 44px targets; the</text>
      <text x="38" y="94" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">whole index is keyboard and screen-reader safe.</text>
    </g>
  </g>

  <text x="40" y="1060" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#4b5563">048:01 | Hat Chapter - Book Index | ScriptHammer</text>
</svg>
