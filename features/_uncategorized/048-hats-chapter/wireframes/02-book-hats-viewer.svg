<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#c7ddf5"/><stop offset="100%" stop-color="#b8d4f0"/></linearGradient>
    <radialGradient id="sky" cx="50%" cy="18%" r="120%">
      <stop offset="0%" stop-color="#2a3550"/>
      <stop offset="55%" stop-color="#1a2138"/>
      <stop offset="100%" stop-color="#131726"/>
    </radialGradient>
    <linearGradient id="botfade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0e0e1c" stop-opacity="0.87"/>
      <stop offset="100%" stop-color="#0e0e1c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="960" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#4b5563" letter-spacing="1">HAT - ROOF FOCUS - FULL-BLEED VIEWER - /book/hat</text>
  <text x="40" y="52" fill="#8b5cf6" font-size="18" font-weight="bold">DESKTOP (16:9)</text>
  <text x="1500" y="52" fill="#d946ef" font-size="18" font-weight="bold">MOBILE</text>

  <!-- ===================== DESKTOP ===================== -->
  <g id="desktop" transform="translate(40, 60)">
    <rect width="1280" height="720" rx="8" fill="#0e0e1c" stroke="#2a2a44"/>
    <use href="includes/header-desktop.svg#desktop-header" x="0" y="0"/>

    <!-- chapter tabs IN the navbar -->
    <g transform="translate(330, 12)">
      <rect width="116" height="34" rx="8" fill="#2563eb"/>
      <text x="58" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">The Hat</text>
      <text x="140" y="23" font-size="14" font-weight="700" fill="#374151">The Coat</text>
      <text x="250" y="23" font-size="14" font-weight="700" fill="#374151">The Boots</text>
    </g>

    <!-- FULL-BLEED STAGE (dark sky) -->
    <g id="stage" transform="translate(0, 56)">
      <rect width="1280" height="600" fill="url(#sky)"/>

      <!-- CANONICAL BUILDING — real chapter SVGs, BIG + centred. HAT FOCUS: roof full,
           coat (wall+window) + boots (footing) dimmed to 0.4 IN PLACE (FR-006: nothing moves). -->
      <g id="building" transform="translate(360, 20)">
        <g id="layer-boots" opacity="0.4">
          <image href="/book/hat/footing.svg" x="0" y="0" width="560" height="560"/>
        </g>
        <g id="layer-coat" opacity="0.4">
          <image href="/book/hat/wall.svg" x="0" y="0" width="560" height="560"/>
          <image href="/book/hat/window.svg" x="0" y="0" width="560" height="560"/>
        </g>
        <g id="layer-hat" opacity="1">
          <image href="/book/hat/roof-overhang.svg" x="0" y="0" width="560" height="560"/>
          <image href="/book/hat/sun-high.svg" x="0" y="0" width="560" height="560"/>
          <image href="/book/hat/sun-low.svg" x="0" y="0" width="560" height="560"/>
          <image href="/book/hat/rain.svg" x="0" y="0" width="560" height="560"/>
        </g>
      </g>

      <!-- WORDS in the LEFT sky -->
      <g id="words" transform="translate(34, 44)">
        <text x="0" y="0" font-size="14" letter-spacing="2" font-weight="800" fill="#8fb4e8">THE HAT - GUIDED VIEW</text>
        <text x="0" y="40" font-size="30" font-weight="800" fill="#ffffff">The summer sun is blocked</text>
        <text x="0" y="74" font-size="16" fill="#dfe6f0">The roof reaches past the wall — an</text>
        <text x="0" y="98" font-size="16" fill="#dfe6f0">overhang — and shades the window.</text>
        <text x="0" y="122" font-size="16" fill="#dfe6f0">The room stays cool, no machine.</text>
        <text x="0" y="170" font-size="14" letter-spacing="1" font-weight="800" fill="#8fb4e8">GUIDED VIEWS</text>
        <g transform="translate(0, 184)" font-size="14" font-weight="700">
          <rect width="180" height="36" rx="18" fill="#2563eb"/><text x="90" y="24" text-anchor="middle" fill="#ffffff">Everything</text>
          <rect y="44" width="180" height="36" rx="18" fill="#1a2138" stroke="#4a5a7a"/><text x="90" y="68" text-anchor="middle" fill="#cdd8ea">Bare wall</text>
          <rect y="88" width="180" height="36" rx="18" fill="#1a2138" stroke="#4a5a7a"/><text x="90" y="112" text-anchor="middle" fill="#cdd8ea">Roof line</text>
          <rect y="132" width="210" height="36" rx="18" fill="#1a2138" stroke="#4a5a7a"/><text x="105" y="156" text-anchor="middle" fill="#cdd8ea">How it sheds water</text>
        </g>
      </g>

      <!-- LAYER TOGGLES in the RIGHT sky -->
      <g id="toggles" transform="translate(1040, 44)" text-anchor="end">
        <text x="210" y="0" font-size="14" letter-spacing="1" font-weight="800" fill="#8fd0ff">TAKE IT APART - TAP A PART</text>
        <g font-size="14" font-weight="700">
          <g transform="translate(50, 22)"><rect width="160" height="34" rx="17" fill="#2563eb"/><circle cx="20" cy="17" r="6" fill="#fff"/><text x="100" y="22" text-anchor="middle" fill="#fff">roof + overhang</text></g>
          <g transform="translate(80, 64)"><rect width="130" height="34" rx="17" fill="#2563eb"/><circle cx="20" cy="17" r="6" fill="#fff"/><text x="85" y="22" text-anchor="middle" fill="#fff">summer sun</text></g>
          <g transform="translate(90, 106)"><rect width="120" height="34" rx="17" fill="#1a2138" stroke="#4a5a7a"/><circle cx="20" cy="17" r="6" fill="none" stroke="#4a5a7a"/><text x="80" y="22" text-anchor="middle" fill="#cdd8ea">winter sun</text></g>
          <g transform="translate(130, 148)"><rect width="80" height="34" rx="17" fill="#1a2138" stroke="#4a5a7a"/><circle cx="20" cy="17" r="6" fill="none" stroke="#4a5a7a"/><text x="55" y="22" text-anchor="middle" fill="#cdd8ea">rain</text></g>
          <g transform="translate(120, 190)"><rect width="90" height="34" rx="17" fill="#2563eb"/><circle cx="20" cy="17" r="6" fill="#fff"/><text x="60" y="22" text-anchor="middle" fill="#fff">walls</text></g>
          <g transform="translate(105, 232)"><rect width="105" height="34" rx="17" fill="#2563eb"/><circle cx="20" cy="17" r="6" fill="#fff"/><text x="68" y="22" text-anchor="middle" fill="#fff">footing</text></g>
        </g>
        <g transform="translate(70, 290)" font-size="14" font-weight="700">
          <rect width="44" height="30" rx="8" fill="#2563eb"/><text x="22" y="20" text-anchor="middle" fill="#fff">EN</text>
          <rect x="50" width="44" height="30" rx="8" fill="#1a2138" stroke="#4a5a7a"/><text x="72" y="20" text-anchor="middle" fill="#cdd8ea">ES</text>
          <rect x="100" width="44" height="30" rx="8" fill="#1a2138" stroke="#4a5a7a"/><text x="122" y="20" text-anchor="middle" fill="#cdd8ea">中文</text>
        </g>
      </g>

      <!-- numbered callouts ON the UI (red circles) -->
      <g font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
        <circle cx="600" cy="120" r="14" fill="#dc2626"/><text x="600" y="125">1</text>
        <circle cx="120" cy="60" r="14" fill="#dc2626"/><text x="120" y="65">2</text>
        <circle cx="1160" cy="80" r="14" fill="#dc2626"/><text x="1160" y="85">3</text>
        <circle cx="600" cy="556" r="14" fill="#dc2626"/><text x="600" y="561">4</text>
      </g>

      <!-- BOTTOM overlaid bar -->
      <rect y="520" width="1280" height="80" fill="url(#botfade)"/>
      <g transform="translate(520, 548)" font-size="14" font-weight="700">
        <rect width="90" height="40" rx="9" fill="#1a2138" stroke="#5a6a8a"/><text x="45" y="26" text-anchor="middle" fill="#dfe6f0">Back</text>
        <g transform="translate(110, 14)"><circle cx="0" cy="6" r="6" fill="#2563eb"/><circle cx="22" cy="6" r="6" fill="#2563eb"/><circle cx="44" cy="6" r="6" fill="#39435f"/><circle cx="66" cy="6" r="6" fill="#39435f"/></g>
        <g transform="translate(200, 0)"><rect width="90" height="40" rx="9" fill="#1a2138" stroke="#5a6a8a"/><text x="45" y="26" text-anchor="middle" fill="#dfe6f0">Next</text></g>
      </g>
    </g>

    <use href="includes/footer-desktop.svg#site-footer" x="0" y="640"/>
  </g>

  <!-- ===================== MOBILE ===================== -->
  <g id="mobile" transform="translate(1360, 60)">
    <rect width="360" height="720" rx="8" fill="#0e0e1c" stroke="#2a2a44"/>
    <use href="includes/header-mobile.svg#mobile-header-group" x="0" y="0"/>
    <g font-size="14" font-weight="700">
      <rect x="14" y="82" width="100" height="32" rx="8" fill="#2563eb"/><text x="64" y="103" text-anchor="middle" fill="#fff">The Hat</text>
      <text x="138" y="103" fill="#9aa6b8">Coat</text><text x="202" y="103" fill="#9aa6b8">Boots</text>
    </g>
    <g transform="translate(0, 92)">
      <rect width="360" height="470" fill="url(#sky)"/>
      <g id="m-building" transform="translate(60, 30)">
        <g opacity="0.4"><image href="/book/hat/footing.svg" x="0" y="0" width="240" height="240"/></g>
        <g opacity="0.4"><image href="/book/hat/wall.svg" x="0" y="0" width="240" height="240"/><image href="/book/hat/window.svg" x="0" y="0" width="240" height="240"/></g>
        <g opacity="1"><image href="/book/hat/roof-overhang.svg" x="0" y="0" width="240" height="240"/><image href="/book/hat/sun-high.svg" x="0" y="0" width="240" height="240"/><image href="/book/hat/sun-low.svg" x="0" y="0" width="240" height="240"/><image href="/book/hat/rain.svg" x="0" y="0" width="240" height="240"/></g>
      </g>
      <text x="16" y="300" font-size="15" font-weight="800" fill="#ffffff">The summer sun is blocked</text>
      <text x="16" y="324" font-size="14" fill="#dfe6f0">The overhang shades the window.</text>
      <rect y="416" width="360" height="54" fill="url(#botfade)"/>
      <g transform="translate(40, 430)" font-size="14" font-weight="700">
        <rect width="80" height="34" rx="8" fill="#1a2138" stroke="#5a6a8a"/><text x="40" y="23" text-anchor="middle" fill="#dfe6f0">Back</text>
        <g transform="translate(200, 0)"><rect width="80" height="34" rx="8" fill="#1a2138" stroke="#5a6a8a"/><text x="40" y="23" text-anchor="middle" fill="#dfe6f0">Next</text></g>
      </g>
    </g>
    <use href="includes/footer-mobile.svg#mobile-bottom-nav" x="0" y="664"/>
  </g>

  <!-- ===================== ANNOTATIONS ===================== -->
  <g id="annotations" transform="translate(40, 740)">
    <rect width="1840" height="230" rx="10" fill="#e8d4b8" stroke="#b8a080"/>
    <!-- (1) US1 -->
    <circle cx="34" cy="40" r="14" fill="#dc2626"/><text x="34" y="45" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <a href="../spec.md#user-story-1"><rect x="58" y="28" width="64" height="24" rx="6" fill="#0891b2"/><text x="90" y="45" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">US-001</text></a>
    <text x="200" y="45" font-size="15" font-weight="700" fill="#1f2937">[FR-001] [FR-007] One shared building fills the frame and dominates; chapters live in the NAVBAR. The /book index is this same viewer with no focus.</text>
    <!-- (2) US1 -->
    <circle cx="34" cy="110" r="14" fill="#dc2626"/><text x="34" y="115" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <a href="../spec.md#user-story-1"><rect x="58" y="98" width="64" height="24" rx="6" fill="#0891b2"/><text x="90" y="115" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">US-001</text></a>
    <text x="200" y="115" font-size="15" font-weight="700" fill="#1f2937">[FR-006] HAT FOCUS = dim-in-place: roof region full opacity, walls + footing dimmed to 0.4 — NOTHING MOVES. Guided views + prose use the empty left sky.</text>
    <!-- (3) US2 -->
    <circle cx="34" cy="180" r="14" fill="#dc2626"/><text x="34" y="185" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <a href="../spec.md#user-story-2"><rect x="58" y="168" width="64" height="24" rx="6" fill="#0891b2"/><text x="90" y="185" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">US-002</text></a>
    <text x="200" y="185" font-size="15" font-weight="700" fill="#1f2937">[FR-004] [FR-016] Layer toggles in the right sky (tap a part on/off). EN active; ES/中文 stub (049). Bottom bar = Back/Next + dots (no totem).</text>
    <!-- (4) US3 — same row, right half -->
    <circle cx="960" cy="180" r="14" fill="#dc2626"/><text x="960" y="185" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <a href="../spec.md#user-story-3"><rect x="984" y="168" width="64" height="24" rx="6" fill="#0891b2"/><text x="1016" y="185" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">US-003</text></a>
    <text x="1060" y="185" font-size="15" font-weight="700" fill="#1f2937">[FR-014] Mobile reflows to a compact spread (no vertical totem), 44px targets.</text>
  </g>

  <text x="40" y="1060" font-size="18" font-weight="bold" fill="#4b5563">048:02 | Hat Chapter (full-bleed viewer) | ScriptHammer</text>
</svg>
