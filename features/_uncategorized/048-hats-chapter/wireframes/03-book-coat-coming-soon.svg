<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#c7ddf5"/><stop offset="100%" stop-color="#b8d4f0"/></linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="960" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#4b5563" letter-spacing="1">COAT - COMING SOON (ENVELOPE FOCUS) - /book/coat</text>
  <text x="40" y="52" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">DESKTOP (16:9)</text>
  <text x="1500" y="52" fill="#d946ef" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">MOBILE</text>

  <g id="desktop" transform="translate(40, 60)">
    <rect width="1280" height="720" rx="8" fill="#e8d4b8" stroke="#b8a080"/>
    <use href="includes/header-desktop.svg#desktop-header" x="0" y="0"/>

    <!-- LEFT RAIL: Chapters + Coming soon panel + language switcher -->
    <g id="left-rail" transform="translate(16, 96)">
      <rect width="314" height="520" rx="8" fill="#f5f0e6" stroke="#b8a080" stroke-width="2"/>
      <text x="20" y="34" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Chapters</text>
      <!-- Hat (inactive) -->
      <rect x="20" y="50" width="274" height="44" rx="6" fill="#dcc8a8" stroke="#b8a080" stroke-width="1.5"/>
      <text x="38" y="78" font-family="system-ui, sans-serif" font-size="16" fill="#1f2937">Hat - the roof</text>
      <!-- Coat (active purple) -->
      <rect x="20" y="104" width="274" height="44" rx="6" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/>
      <text x="38" y="132" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f5f0e6">Coat - the envelope</text>
      <!-- Boots (inactive) -->
      <rect x="20" y="158" width="274" height="44" rx="6" fill="#dcc8a8" stroke="#b8a080" stroke-width="1.5"/>
      <text x="38" y="186" font-family="system-ui, sans-serif" font-size="16" fill="#1f2937">Boots - the foundation</text>

      <!-- Coming soon panel -->
      <rect x="20" y="220" width="274" height="156" rx="8" fill="#dcc8a8" stroke="#b8a080" stroke-width="2"/>
      <text x="36" y="252" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2937">Coming soon</text>
      <text x="36" y="280" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">The Coat chapter is being</text>
      <text x="36" y="300" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">written.</text>
      <!-- Read the Hat chapter button (>=44px) -->
      <a href="#us-001" transform="translate(36, 318)">
        <rect width="242" height="46" rx="8" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/>
        <text x="121" y="29" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f5f0e6">Read the Hat chapter</text>
      </a>

      <!-- Language switcher EN / ES / 中文 -->
      <text x="20" y="424" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Language</text>
      <g transform="translate(20, 436)">
        <rect x="0" y="0" width="80" height="44" rx="6" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/>
        <text x="40" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f5f0e6">EN</text>
        <rect x="92" y="0" width="80" height="44" rx="6" fill="#f5f0e6" stroke="#b8a080" stroke-width="1.5"/>
        <text x="132" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#1f2937">ES</text>
        <rect x="184" y="0" width="90" height="44" rx="6" fill="#f5f0e6" stroke="#b8a080" stroke-width="1.5"/>
        <text x="229" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#1f2937">中文</text>
      </g>
    </g>

    <!-- ===== CANONICAL BUILDING (identical in every wireframe; translate fixed at 360,150) ===== -->
    <g id="building" transform="translate(360, 150)">
      <!-- layer: sun-high (summer, steep) -->
      <g id="layer-sun-high">
        <line x1="40" y1="-2" x2="150" y2="150" stroke="#e8821e" stroke-width="3" stroke-dasharray="4 5"/>
        <line x1="70" y1="-2" x2="180" y2="150" stroke="#e8821e" stroke-width="3" stroke-dasharray="4 5"/>
        <text x="10" y="20" font-family="system-ui, sans-serif" font-size="14" fill="#c25a14">summer sun (high) - blocked at eave</text>
      </g>
      <!-- layer: sun-low (winter, shallow) -->
      <g id="layer-sun-low">
        <line x1="-40" y1="150" x2="250" y2="250" stroke="#e8821e" stroke-width="3"/>
        <text x="-40" y="142" font-family="system-ui, sans-serif" font-size="14" fill="#c25a14">winter sun (low) - reaches window</text>
      </g>
      <!-- layer: rain -->
      <g id="layer-rain">
        <line x1="20" y1="166" x2="0" y2="330" stroke="#0e6e8c" stroke-width="2" stroke-dasharray="2 7"/>
        <line x1="34" y1="166" x2="14" y2="330" stroke="#0e6e8c" stroke-width="2" stroke-dasharray="2 7"/>
        <text x="-40" y="352" font-family="system-ui, sans-serif" font-size="14" fill="#0e6e8c">rain sheds clear of the wall base</text>
      </g>
      <!-- layer: foundation / BOOTS (footing) -->
      <g id="layer-boots" opacity="0.4">
        <rect x="40" y="300" width="280" height="34" fill="#3a6ea5" stroke="#26527a" stroke-width="2"/>
        <line x1="-20" y1="334" x2="380" y2="334" stroke="#3a6ea5" stroke-width="2"/>
        <text x="180" y="324" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f5f0e6">BOOTS</text>
      </g>
      <!-- layer: envelope / COAT (walls + window) -->
      <g id="layer-coat">
        <rect x="80" y="120" width="200" height="180" fill="#f3e2c7" stroke="#3a6ea5" stroke-width="3"/>
        <rect x="120" y="170" width="120" height="90" fill="#bfe3ec" stroke="#3a6ea5" stroke-width="2"/>
        <text x="180" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#1f2937">COAT</text>
      </g>
      <!-- layer: roof / HAT (roof + projecting overhang) -->
      <g id="layer-hat" opacity="0.4">
        <polygon points="60,120 180,40 300,120" fill="#b07a4a" stroke="#3a6ea5" stroke-width="3"/>
        <rect x="30" y="120" width="300" height="16" rx="2" fill="#b07a4a" stroke="#3a6ea5" stroke-width="2"/>
        <text x="180" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f5f0e6">HAT</text>
      </g>
    </g>

    <!-- RIGHT RAIL: layer toggles DISABLED/greyed -->
    <g id="right-rail" transform="translate(946, 96)">
      <rect width="302" height="520" rx="8" fill="#f5f0e6" stroke="#b8a080" stroke-width="2"/>
      <text x="20" y="34" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#6b7280">Layer toggles</text>
      <!-- disabled toggle: Sun -->
      <rect x="20" y="52" width="262" height="44" rx="6" fill="#dcc8a8" stroke="#6b7280" stroke-width="1.5"/>
      <text x="36" y="80" font-family="system-ui, sans-serif" font-size="16" fill="#6b7280">Sun path</text>
      <rect x="222" y="62" width="48" height="24" rx="12" fill="#6b7280" stroke="#6b7280" stroke-width="1.5"/>
      <circle cx="234" cy="74" r="9" fill="#6b7280"/>
      <!-- disabled toggle: Rain -->
      <rect x="20" y="106" width="262" height="44" rx="6" fill="#dcc8a8" stroke="#6b7280" stroke-width="1.5"/>
      <text x="36" y="134" font-family="system-ui, sans-serif" font-size="16" fill="#6b7280">Rain shedding</text>
      <rect x="222" y="116" width="48" height="24" rx="12" fill="#6b7280" stroke="#6b7280" stroke-width="1.5"/>
      <circle cx="234" cy="128" r="9" fill="#6b7280"/>
      <!-- disabled toggle: Envelope -->
      <rect x="20" y="160" width="262" height="44" rx="6" fill="#dcc8a8" stroke="#6b7280" stroke-width="1.5"/>
      <text x="36" y="188" font-family="system-ui, sans-serif" font-size="16" fill="#6b7280">Envelope detail</text>
      <rect x="222" y="170" width="48" height="24" rx="12" fill="#6b7280" stroke="#6b7280" stroke-width="1.5"/>
      <circle cx="234" cy="182" r="9" fill="#6b7280"/>
      <!-- note -->
      <text x="20" y="244" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">Region content not ready</text>
    </g>

    <!-- Red callout circles on building and controls -->
    <circle cx="500" cy="320" r="14" fill="#dc2626"/>
    <text x="500" y="326" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f5f0e6">1</text>
    <circle cx="180" cy="354" r="14" fill="#dc2626"/>
    <text x="180" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f5f0e6">2</text>
    <circle cx="170" cy="430" r="14" fill="#dc2626"/>
    <text x="170" y="436" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f5f0e6">3</text>
    <circle cx="60" cy="556" r="14" fill="#dc2626"/>
    <text x="60" y="562" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f5f0e6">4</text>

    <use href="includes/footer-desktop.svg#site-footer" x="0" y="640"/>
  </g>

  <g id="mobile" transform="translate(1360, 60)">
    <rect width="360" height="720" rx="24" fill="#e8d4b8" stroke="#b8a080"/>
    <use href="includes/header-mobile.svg#mobile-header-group" x="0" y="0"/>

    <!-- Chapter tabs -->
    <rect x="16" y="96" width="100" height="40" rx="6" fill="#dcc8a8" stroke="#b8a080" stroke-width="1.5"/>
    <text x="66" y="121" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#1f2937">Hat</text>
    <rect x="124" y="96" width="100" height="40" rx="6" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/>
    <text x="174" y="121" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5f0e6">Coat</text>
    <rect x="232" y="96" width="112" height="40" rx="6" fill="#dcc8a8" stroke="#b8a080" stroke-width="1.5"/>
    <text x="288" y="121" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#1f2937">Boots</text>

    <!-- Small stacked building echo (HAT/COAT/BOOTS) -->
    <g id="mobile-building" transform="translate(116, 150)">
      <!-- HAT dimmed -->
      <g opacity="0.4">
        <polygon points="0,80 64,30 128,80" fill="#b07a4a" stroke="#3a6ea5" stroke-width="2"/>
        <rect x="-10" y="80" width="148" height="10" rx="2" fill="#b07a4a" stroke="#3a6ea5" stroke-width="1.5"/>
        <text x="64" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5f0e6">HAT</text>
      </g>
      <!-- COAT focused -->
      <rect x="20" y="90" width="88" height="86" fill="#f3e2c7" stroke="#3a6ea5" stroke-width="2.5"/>
      <rect x="42" y="116" width="44" height="40" fill="#bfe3ec" stroke="#3a6ea5" stroke-width="1.5"/>
      <text x="64" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">COAT</text>
      <!-- BOOTS dimmed -->
      <g opacity="0.4">
        <rect x="10" y="176" width="108" height="18" fill="#3a6ea5" stroke="#26527a" stroke-width="1.5"/>
        <text x="64" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5f0e6">BOOTS</text>
      </g>
    </g>

    <!-- Coming soon panel -->
    <rect x="16" y="368" width="328" height="120" rx="8" fill="#dcc8a8" stroke="#b8a080" stroke-width="2"/>
    <text x="32" y="398" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Coming soon</text>
    <text x="32" y="422" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">The Coat chapter is being written.</text>
    <a href="#us-004" transform="translate(32, 436)">
      <rect width="296" height="44" rx="8" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/>
      <text x="148" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f5f0e6">Read the Hat chapter</text>
    </a>

    <!-- Disabled toggles note -->
    <rect x="16" y="500" width="328" height="44" rx="6" fill="#e8d4b8" stroke="#6b7280" stroke-width="1.5"/>
    <text x="32" y="528" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">Region content not ready</text>

    <!-- Language switcher -->
    <g transform="translate(16, 556)">
      <rect x="0" y="0" width="100" height="44" rx="6" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/>
      <text x="50" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f5f0e6">EN</text>
      <rect x="112" y="0" width="100" height="44" rx="6" fill="#f5f0e6" stroke="#b8a080" stroke-width="1.5"/>
      <text x="162" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#1f2937">ES</text>
      <rect x="224" y="0" width="104" height="44" rx="6" fill="#f5f0e6" stroke="#b8a080" stroke-width="1.5"/>
      <text x="276" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#1f2937">中文</text>
    </g>

    <!-- Mobile callouts (r=11) -->
    <circle cx="180" cy="290" r="11" fill="#dc2626"/>
    <text x="180" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5f0e6">1</text>
    <circle cx="330" cy="380" r="11" fill="#dc2626"/>
    <text x="330" y="385" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5f0e6">2</text>

    <use href="includes/footer-mobile.svg#mobile-bottom-nav" x="0" y="664"/>
  </g>

  <g id="annotations" transform="translate(40, 800)">
    <rect width="1840" height="220" rx="8" fill="#dcc8a8" stroke="#b8a080"/>

    <g transform="translate(20, 16)">
      <circle cx="12" cy="12" r="12" fill="#dc2626"/>
      <text x="12" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5f0e6">1</text>
      <text x="38" y="17" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2937">Same building, envelope focus</text>
      <a href="#us-001" transform="translate(38, 28)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-001</text></a>
      <a href="#fr-001a" transform="translate(102, 28)"><rect width="64" height="22" rx="11" fill="#2563eb"/><text x="32" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">FR-001a</text></a>
      <a href="#fr-007b" transform="translate(174, 28)"><rect width="64" height="22" rx="11" fill="#2563eb"/><text x="32" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">FR-007b</text></a>
      <text x="38" y="76" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">The canonical building is unchanged at translate(360,150); only the</text>
      <text x="38" y="94" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">COAT walls stay full opacity while HAT and BOOTS dim to 0.4.</text>
    </g>

    <g transform="translate(520, 16)">
      <circle cx="12" cy="12" r="12" fill="#dc2626"/>
      <text x="12" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5f0e6">2</text>
      <text x="38" y="17" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2937">Coming soon, never broken</text>
      <a href="#us-004" transform="translate(38, 28)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-004</text></a>
      <a href="#fr-007" transform="translate(102, 28)"><rect width="56" height="22" rx="11" fill="#2563eb"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">FR-007</text></a>
      <text x="38" y="76" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">A coming-soon panel reads &quot;The Coat chapter is being written&quot; and</text>
      <text x="38" y="94" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">offers a Read-the-Hat-chapter button - the page is never a dead end.</text>
    </g>

    <g transform="translate(1020, 16)">
      <circle cx="12" cy="12" r="12" fill="#dc2626"/>
      <text x="12" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5f0e6">3</text>
      <text x="38" y="17" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2937">Navigable from day one</text>
      <a href="#us-001" transform="translate(38, 28)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-001</text></a>
      <a href="#fr-007" transform="translate(102, 28)"><rect width="56" height="22" rx="11" fill="#2563eb"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">FR-007</text></a>
      <text x="38" y="76" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">All three chapters appear in the rail; Coat is highlighted active even</text>
      <text x="38" y="94" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">while empty, so the structure is browsable before content lands.</text>
    </g>

    <g transform="translate(20, 116)">
      <circle cx="12" cy="12" r="12" fill="#dc2626"/>
      <text x="12" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5f0e6">4</text>
      <text x="38" y="17" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2937">Language persists</text>
      <a href="#us-003" transform="translate(38, 28)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-003</text></a>
      <a href="#fr-016" transform="translate(102, 28)"><rect width="56" height="22" rx="11" fill="#2563eb"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">FR-016</text></a>
      <text x="38" y="76" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">The EN / ES / 中文 switcher carries the selected locale across chapters</text>
      <text x="38" y="94" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">so a reader&apos;s language choice survives navigation to the Hat chapter.</text>
    </g>
  </g>

  <text x="40" y="1060" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#4b5563">048:03 | Coat Chapter - Coming Soon | ScriptHammer</text>
</svg>
