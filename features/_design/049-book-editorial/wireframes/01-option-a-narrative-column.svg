  <rect x="320" y="120" width="560" height="540" rx="16" fill="none" stroke="#25254a"/>
  <!-- house glyph -->
  <ellipse cx="600" cy="612" rx="170" ry="20" fill="#000" opacity="0.4"/>
  <polygon points="600,210 455,335 745,335" fill="#a8542f" stroke="#2d3a4a" stroke-width="2"/>
  <rect x="520" y="335" width="160" height="245" fill="#3a3f4d" stroke="#e2e8f0" stroke-width="2"/>
