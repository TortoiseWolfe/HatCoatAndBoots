  <text x="320" y="700" fill="#a8b2c1" font-size="12" letter-spacing="2" font-family="sans-serif">LAYER CONTROLS</text>
  <g font-family="sans-serif" font-size="13" fill="#e2e8f0">
    <rect x="320" y="712" width="80" height="34" rx="17" fill="#25254a"/><text x="335" y="734">● wall</text>
    <rect x="408" y="712" width="98" height="34" rx="17" fill="#25254a"/><text x="423" y="734">● window</text>
    <rect x="514" y="712" width="120" height="34" rx="17" fill="#1d3a55"/><text x="529" y="734" fill="#9fd0ee">● insulation</text>
    <rect x="642" y="712" width="100" height="34" rx="17" fill="#1d3a55"/><text x="657" y="734" fill="#9fd0ee">● air seal</text>
    <rect x="320" y="754" width="120" height="34" rx="17" fill="#16162a" stroke="#25254a"/><text x="338" y="776" fill="#a8b2c1">↺ rebuild</text>
  </g>

  <!-- RIGHT: changing narrative column -->
  <text x="930" y="160" fill="#e8d4b8" font-size="40" font-weight="bold">The Whole</text>
  <text x="930" y="206" fill="#e8d4b8" font-size="40" font-weight="bold">System</text>
  <rect x="930" y="226" width="70" height="4" fill="#38bdf8"/>
  <g fill="#e2e8f0" font-size="19">
    <text x="930" y="282">Here is the whole system: framing</text>
    <text x="930" y="312">surrounded by cavity insulation,</text>
    <text x="930" y="342">wrapped in a continuous outer layer,</text>
    <text x="930" y="372">sealed by an air-and-vapor membrane,</text>
    <text x="930" y="402">and backed by thermal mass. Each</text>
    <text x="930" y="432">layer has a job. Step through the</text>
    <text x="930" y="462">views to see how each one works.</text>
  </g>
  <text x="930" y="540" fill="#a8b2c1" font-size="15" font-style="italic">↻ this whole column rewrites itself</text>
  <text x="930" y="564" fill="#a8b2c1" font-size="15" font-style="italic">when you pick a different view</text>

