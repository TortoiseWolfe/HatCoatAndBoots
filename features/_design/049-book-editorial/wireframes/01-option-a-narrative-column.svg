  <rect x="638" y="49" width="78" height="2.5" fill="#38bdf8"/>
  <text x="744" y="39" fill="#a8b2c1" font-size="17">·&#160;&#160;The Boots</text>
  <g fill="none" stroke="#a8b2c1" stroke-width="2"><circle cx="1330" cy="32" r="12"/><circle cx="1370" cy="32" r="12"/><circle cx="1410" cy="32" r="12"/></g>

  <text x="700" y="92" fill="#5b6b7d" font-size="13" font-family="sans-serif" font-style="italic">OPTION A — building left · changing narrative column right</text>

  <!-- LEFT: guided views numbered index -->
  <text x="40" y="140" fill="#a8b2c1" font-size="12" letter-spacing="2" font-family="sans-serif">GUIDED VIEWS</text>
  <g font-family="sans-serif" font-size="15">
    <rect x="34" y="152" width="250" height="46" rx="9" fill="#25254a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="52" y="180" fill="#e2e8f0">①&#160;&#160;The Whole System</text>
    <rect x="34" y="206" width="250" height="46" rx="9" fill="#16162a" stroke="#25254a"/>
    <text x="52" y="234" fill="#cbd3df">②&#160;&#160;The Problem</text>
    <rect x="34" y="260" width="250" height="46" rx="9" fill="#16162a" stroke="#25254a"/>
    <text x="52" y="288" fill="#cbd3df">③&#160;&#160;The Fix</text>
    <rect x="34" y="314" width="250" height="46" rx="9" fill="#16162a" stroke="#25254a"/>
    <text x="52" y="342" fill="#cbd3df">④&#160;&#160;The Bonus</text>
  </g>
  <!-- how to read it disclosure (collapsed pill) -->
  <rect x="34" y="392" width="210" height="40" rx="20" fill="#16162a" stroke="#25254a"/>
  <text x="56" y="417" fill="#a8b2c1" font-size="14" font-family="sans-serif">⌃&#160;&#160;how to read it</text>

  <!-- CENTRE: building hero -->
  <rect x="320" y="120" width="560" height="540" rx="16" fill="#13131f"/>
  <g stroke="#222238" stroke-width="1" opacity="0.7">
    <line x1="320" y1="255" x2="880" y2="255"/><line x1="320" y1="390" x2="880" y2="390"/><line x1="320" y1="525" x2="880" y2="525"/>
    <line x1="460" y1="120" x2="460" y2="660"/><line x1="600" y1="120" x2="600" y2="660"/><line x1="740" y1="120" x2="740" y2="660"/>
