<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" role="img" aria-hidden="true">
  <!-- BOOTS (the lesson): the finish grade sloping AWAY from the foundation, a band
       of coarse gravel against the footing, and a perimeter drain that carries water
       off. Ground line at y=300; piers x=150..172 & x=220..242; footing pads at
       y=330..340. Drawn to the right (south) of the building. Shared 0 0 360 360. -->
  <defs>
    <pattern id="boots-gravel" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#9aa7b3"/>
      <circle cx="6" cy="6" r="1.3" fill="#7f8c99"/>
    </pattern>
  </defs>
  <!-- sloped finish grade falling away to the right -->
  <path d="M250 300 L320 318" fill="none" stroke="#2d3a4a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- gravel band against the footing -->
  <rect x="246" y="302" width="20" height="38" fill="url(#boots-gravel)" stroke="#2d3a4a" stroke-width="1.2"/>
  <!-- perimeter drain pipe at the base of the footing -->
  <circle cx="256" cy="336" r="6" fill="#cfe3ee" stroke="#2d3a4a" stroke-width="2"/>
  <circle cx="256" cy="336" r="2" fill="#2d3a4a" opacity="0.5"/>
  <!-- flow arrow: water running away from the building -->
  <g stroke="#5b86a8" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M276 312 L308 322"/>
    <path d="M300 316 l8 6 l-9 3"/>
  </g>
</svg>
