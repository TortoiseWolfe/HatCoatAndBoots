<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" role="img" aria-hidden="true">
  <!-- SUMMER SUN (high, BLOCKED). Distinguished from the winter sun by SHAPE +
       ANGLE, not color alone (FR-012): a high disc, well up the sky and toward
       the south, with STEEP, DASHED, many-pointed rays coming down at a steep
       angle and STOPPING at the projecting eave (right eave tip ≈ x=290,y=120).
       A short shadow cast just below the eave onto the wall top makes the
       "blocked" story explicit — the window below stays shaded. Warm ochre.
       Shared 0 0 360 360 space. -->
  <defs>
    <radialGradient id="sun-high-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6c453"/>
      <stop offset="1" stop-color="#e8a02e"/>
    </radialGradient>
  </defs>
  <!-- the high summer sun, up and to the south (upper-right but higher than winter) -->
  <g transform="translate(300,46)">
    <g stroke="#e8a02e" stroke-width="2.5" stroke-linecap="round">
      <line x1="0" y1="-26" x2="0" y2="-17"/>
      <line x1="18" y1="-18" x2="12" y2="-12"/>
      <line x1="26" y1="0" x2="17" y2="0"/>
      <line x1="18" y1="18" x2="12" y2="12"/>
      <line x1="0" y1="26" x2="0" y2="17"/>
      <line x1="-18" y1="18" x2="-12" y2="12"/>
      <line x1="-26" y1="0" x2="-17" y2="0"/>
      <line x1="-18" y1="-18" x2="-12" y2="-12"/>
    </g>
    <circle r="14" fill="url(#sun-high-glow)" stroke="#c8801f" stroke-width="1.5"/>
  </g>
  <!-- STEEP dashed rays dropping onto the eave tip and STOPPING there -->
  <g stroke="#e8a02e" stroke-width="2.4" stroke-dasharray="7 5" stroke-linecap="round" opacity="0.95">
    <line x1="292" y1="68" x2="289" y2="116"/>
    <line x1="304" y1="66" x2="293" y2="116"/>
    <line x1="316" y1="70" x2="298" y2="117"/>
  </g>
  <!-- blunt "stop" cap across the eave where the summer rays are intercepted -->
  <line x1="282" y1="118" x2="302" y2="118" stroke="#a8542f" stroke-width="3.5" stroke-linecap="round"/>
  <!-- the shadow the eave throws DOWN the south wall: the window is in shade -->
  <path d="M242 122 L242 250 L226 250 L234 122 Z" fill="#2d3a4a" opacity="0.16"/>
  <text x="250" y="150" font-family="Georgia, serif" font-size="9" fill="#2d3a4a" opacity="0.7">shade</text>
</svg>
