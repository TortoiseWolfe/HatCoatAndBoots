<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" role="img" aria-hidden="true">
  <!-- BOOTS (context): footing piers lifting the structure above the ground line.
       Warm architectural-blueprint style: ink-blue linework, slate stone fill,
       hatched earth below grade. Shared 0 0 360 360 coordinate space. -->
  <defs>
    <pattern id="footing-earth" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#7c6f5a" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>
  <!-- ground line -->
  <line x1="40" y1="300" x2="320" y2="300" stroke="#2d3a4a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- earth below grade -->
  <rect x="40" y="300" width="280" height="44" fill="url(#footing-earth)"/>
  <!-- left pier -->
  <rect x="150" y="300" width="22" height="34" fill="#9aa7b3" stroke="#2d3a4a" stroke-width="2"/>
  <!-- right pier -->
  <rect x="220" y="300" width="22" height="34" fill="#9aa7b3" stroke="#2d3a4a" stroke-width="2"/>
  <!-- spread footing pads -->
  <rect x="142" y="330" width="38" height="10" rx="1.5" fill="#7f8c99" stroke="#2d3a4a" stroke-width="2"/>
  <rect x="212" y="330" width="38" height="10" rx="1.5" fill="#7f8c99" stroke="#2d3a4a" stroke-width="2"/>
</svg>
