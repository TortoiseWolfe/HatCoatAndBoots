<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" role="img" aria-hidden="true">
  <!-- WINTER SUN (low, admitted). Distinguished from the summer sun by SHAPE +
       ANGLE, not color alone (FR-012): a low disc near the right horizon with a
       FEW LONG, SHALLOW, SOLID rays that travel almost horizontally, slip BENEATH
       the projecting eave (tip ≈ x=290,y=120), and reach the window glass
       (x=186..232, sill y≈246). Cooler gold to read as low winter light, but the
       defining difference is the shallow path + long solid rays. Shared 0 0 360 360. -->
  <defs>
    <radialGradient id="sun-low-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#e6b455"/>
    </radialGradient>
  </defs>
  <!-- the low winter sun, near the right edge, low in the sky -->
  <g transform="translate(326,196)">
    <!-- sparse, longer rays angled low = "low, weak, glancing" -->
    <g stroke="#e6b455" stroke-width="2.5" stroke-linecap="round">
      <line x1="-24" y1="-10" x2="-15" y2="-7"/>
      <line x1="-26" y1="2" x2="-17" y2="2"/>
      <line x1="-24" y1="14" x2="-15" y2="10"/>
      <line x1="-14" y1="-20" x2="-9" y2="-13"/>
    </g>
    <circle r="13" fill="url(#sun-low-glow)" stroke="#c89436" stroke-width="1.5"/>
  </g>
  <!-- LONG shallow solid rays passing under the eave to the window -->
  <g stroke="#e6b455" stroke-width="2.6" stroke-linecap="round" opacity="0.95">
    <line x1="300" y1="192" x2="206" y2="214"/>
    <line x1="300" y1="200" x2="210" y2="226"/>
    <line x1="300" y1="208" x2="214" y2="238"/>
  </g>
  <!-- arrowhead at the window: light arriving on the glass -->
  <path d="M214 238 l-12 -1 l6 -7 z" fill="#e6b455" opacity="0.95"/>
  <!-- a little warm pool on the sill where winter light lands -->
  <ellipse cx="208" cy="244" rx="14" ry="3.5" fill="#ffd98a" opacity="0.55"/>
</svg>
